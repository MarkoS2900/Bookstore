
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookstore-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    ports:
      - "1433:1433"
    volumes:
      - bookstore_sql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  bookstore_sql_data:
